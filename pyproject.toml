[build-system]
requires = ["hatchling>=1.26"]  # 1.26+: PEP 639 license metadata
build-backend = "hatchling.build"

[project]
name = "highhxpack"
dynamic = ["version"]
description = "Local-first memory and context engine for AI applications, agents, and developer tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HighHXPack contributors" }]
keywords = ["ai", "memory", "llm", "agents", "context", "retrieval", "sqlite", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# The core package intentionally has no third-party runtime dependencies.
dependencies = []

[project.optional-dependencies]
# Ollama is reached over HTTP with the standard library; the extra exists so that
# `pip install "highhxpack[ollama]"` works and documents intent.
ollama = []
openai = ["openai>=1.40"]
sentence-transformers = ["sentence-transformers>=2.7"]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.11"]
all = [
    "openai>=1.40",
    "sentence-transformers>=2.7",
    "langchain-core>=0.3",
    "llama-index-core>=0.11",
]

[project.scripts]
highhxpack = "highhxpack.cli.main:main"

[project.urls]
# PLACEHOLDER: the github.com/highhxpack/highhxpack repository has not been verified to
# exist. Replace every URL below (and in README.md, CONTRIBUTING.md, CHANGELOG.md and
# docs/installation.md) with the real repository before publishing.
Homepage = "https://github.com/highhxpack/highhxpack"
Documentation = "https://github.com/highhxpack/highhxpack/tree/main/docs"
Repository = "https://github.com/highhxpack/highhxpack"
Issues = "https://github.com/highhxpack/highhxpack/issues"
Changelog = "https://github.com/highhxpack/highhxpack/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Linters/type checker are bounded so new releases cannot break CI unexpectedly;
    # bump deliberately (and keep .pre-commit-config.yaml in sync).
    "ruff>=0.16,<0.17",
    "mypy>=2.0,<3",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.0",
]

[tool.hatch.version]
path = "src/highhxpack/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/highhxpack"]
# 2.4 covers everything used (license expression) and is the most widely supported.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "src/highhxpack",
    "tests",
    "docs",
    "examples",
    "benchmarks",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: tests that exercise several components or the installed CLI",
    "slow: tests that use large datasets",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["highhxpack"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "S", "PT", "RET", "PIE", "N", "PL", "TID",
]
ignore = [
    "PLR0913",  # public APIs intentionally expose keyword-only options
    "PLR2004",  # magic-value comparisons in tests/validation are explicit
    "PLR0911",
    "PLR0912",
    "PLC0415",  # lazy imports are deliberate for optional dependencies
    "RET505",
    "SIM905",   # word lists written as "a b c".split() are easier to read and edit
]

[tool.ruff.lint.per-file-ignores]
# SQL there is assembled only from constant fragments and "?" placeholders;
# every value is passed as a bound parameter.
"src/highhxpack/storage/sqlite.py" = ["S608"]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "PLR0915", "N802"]
"benchmarks/**" = ["S311", "T201"]
"examples/**" = ["T201", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/highhxpack"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "openai.*",
    "sentence_transformers.*",
    "langchain_core.*",
    "llama_index.*",
    "numpy.*",
]
ignore_missing_imports = true
